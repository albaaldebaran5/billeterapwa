<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#70D147" />
  <meta name="description" content="Mi Billetera Lite - PWA ultraligera para registrar tus gastos diarios con soporte 100% offline." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Billetera" />

  <title>Mi Billetera Lite</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192x192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Barra Superior Fija -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4" />
            <path d="M4 6v12c0 1.1.9 2 2 2h14v-4" />
            <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Mi Billetera Lite</h1>
          <p class="brand-subtitle"></p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Indicador de estado de conexión -->
        <div id="status-badge" class="status-badge online" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">En línea</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="app-main">
    <section class="summary-card" aria-labelledby="summary-label">
      <div class="summary-header">
        <span id="summary-label" class="summary-label">Total</span>
      </div>
      <div id="total-amount" class="total-amount" aria-live="polite">$0.00</div>
    </section>

    <!-- Formulario de Registro de Gasto -->
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title" class="section-title">Nuevo Gasto</h2>

      <form id="expense-form" class="expense-form" novalidate>
        <div class="form-group">
          <label for="concepto" class="form-label">Concepto</label>
          <input
            type="text"
            id="concepto"
            name="concepto"
            class="form-control"
            placeholder="Ej: Café, Taxis, Mercado..."
            maxlength="80"
            autocomplete="off"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="monto" class="form-label">Monto</label>
            <input
              type="number"
              id="monto"
              name="monto"
              class="form-control"
              placeholder="45.50"
              step="0.01"
              min="0.01"
              inputmode="decimal"
              required
            />
          </div>

          <div class="form-group">
            <label for="categoria" class="form-label">Categoría</label>
            <select id="categoria" name="categoria" class="form-control" required>
              <option value="Transporte">Transporte</option>
              <option value="Comida">Comida</option>
              <option value="Servicios">Servicios</option>
              <option value="Salud">Salud</option>
              <option value="Ocio">Ocio</option>
              <option value="Otros">Otros</option>
            </select>
          </div>
        </div>

        <p id="form-feedback" class="form-feedback" role="alert" hidden></p>

        <button type="submit" id="btn-submit" class="btn-primary">
          Guardar gasto
        </button>
      </form>
    </section>

    <!-- Historial de Gastos -->
    <section class="card history-section" aria-labelledby="history-title">
      <div class="history-header">
        <h2 id="history-title" class="section-title">Historial de Gastos</h2>
      </div>

      <!-- Estado vacío -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <line x1="7" y1="9" x2="17" y2="9" />
            <line x1="7" y1="13" x2="13" y2="13" />
          </svg>
        </div>
        <p class="empty-title">Sin gastos registrados</p>
      </div>

      <!-- Lista de gastos -->
      <ul id="expense-list" class="expense-list" aria-live="polite" hidden></ul>
    </section>
  </main>


  <!-- Scripts locales (Sin CDNs externos) -->
  <script src="./js/db.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
